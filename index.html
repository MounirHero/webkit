<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unified WebKit Exploit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #e8e8e8;
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #uwrap {
    display: flex; flex-direction: row;
    width: 100%; height: 100%;
    padding: 16px; gap: 16px;
  }

  /* LEFT COLUMN */
  #uleft {
    display: flex; flex-direction: column;
    flex: 1; min-width: 0; gap: 10px;
  }
  #uhead {
    display: flex; flex-direction: column;
    align-items: flex-start; gap: 6px;
    flex-shrink: 0;
  }
  #ulogo {
    width: min(320px, 40vw); height: auto;
    border-radius: 12px;
  }
  #ubyline {
    font-size: 13px; color: #8fa0b3;
    padding-left: 4px;
  }
  #ufwline {
    font-size: 14px; color: #9fb1c3; padding-left: 4px;
  }
  #ufwline b { color: #fff; }

  /* LOG - clean, only green and red visible */
  #ulog {
    flex: 1; min-height: 0;
    background: #0a0a0a; border: 1px solid #222; border-radius: 10px;
    padding: 10px 12px;
    font: 12px/1.5 "Consolas", "DejaVu Sans Mono", monospace;
    color: #b9e6b0; white-space: pre-wrap; overflow-y: auto;
  }
  #ulog .err { color: #ff9a8a; }
  #ulog .success { color: #7fd88a; }
  #ulog .info, #ulog .warn { display: none !important; }

  /* umtx2 console */
  #uchain {
    display: none;
    flex: 1; min-height: 0;
  }
  #uchain #console {
    width: 100%; height: 100%;
    background: #0a0a0a; border: 1px solid #222; border-radius: 10px;
    padding: 10px 12px;
    font: 12px/1.5 "Consolas", "DejaVu Sans Mono", monospace;
    color: #b9e6b0; white-space: pre-wrap; overflow-y: auto;
  }
  #uchain #console .LOG-INFO,
  #uchain #console .LOG-WARN { display: none !important; }
  #uchain #console .LOG-ERROR { color: #ff9a8a; }
  #uchain #console .LOG-SUCCESS { color: #7fd88a; }

  /* RIGHT COLUMN - payload panel */
  #uright {
    display: none;
    flex-direction: column;
    width: 320px; flex-shrink: 0;
    background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 14px; gap: 10px;
    overflow-y: auto;
  }
  #uright h2 {
    font-size: 15px; color: #fff; letter-spacing: 1px;
    border-bottom: 1px solid #333; padding-bottom: 8px;
  }
  .payload-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #161616; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 10px 12px;
  }
  .payload-name {
    font-size: 12px; color: #ccc; font-family: monospace;
    word-break: break-all;
  }
  .payload-btn {
    background: #1a3a1a; color: #7fd88a; border: 1px solid #2d5a2d;
    border-radius: 6px; padding: 6px 14px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    white-space: nowrap; margin-left: 8px;
  }
  .payload-btn:hover { background: #224422; }
  .payload-btn:disabled {
    background: #222; color: #555; border-color: #333; cursor: not-allowed;
  }
  .payload-btn.sent {
    background: #1a3a3a; color: #9fc7ff; border-color: #2d4a5a;
  }
  #payload-status {
    font-size: 11px; color: #666; text-align: center; margin-top: 4px;
  }

  /* Hidden iframe */
  #extframe {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    z-index: 1; opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>

<iframe id="extframe" sandbox="allow-scripts allow-same-origin"></iframe>

<div id="uwrap">
  <div id="uleft">
    <div id="uhead">
      <img id="ulogo" src="logo.jpg" alt="PS5"/>
      <div id="ubyline">by InsideMatrixDev</div>
      <div id="ufwline">detecting firmware...</div>
    </div>
    <div id="ulog"></div>
    <div id="uchain"></div>
  </div>

  <div id="uright">
    <h2>PAYLOADS</h2>
    <div id="payload-list"></div>
    <div id="payload-status">waiting for jailbreak...</div>
  </div>
</div>

<script>
(function () {
  var UX = ["1.00","1.01","1.02","1.05","1.10","1.11","1.12","1.13","1.14","2.00","2.20","2.25","2.26","2.30","2.50","2.70","3.00","3.10","3.20","3.21","4.00","4.02","4.03","4.50","4.51","5.00","5.02","5.10","5.50"];
  var POOPS = ["7.00","7.01","7.02","7.40","7.50","7.51","7.55","7.60","7.61","8.00","8.01","8.03","8.20","8.30","8.40","8.50","8.60","9.00","9.20","9.40","9.60","10.00","10.01","10.20","10.40","10.60","11.00","11.20","11.40","11.60","12.00"];
  var P2JB  = ["12.00","12.02","12.40","12.50","12.70"];

  var logEl = document.getElementById("ulog");
  var uchainEl = document.getElementById("uchain");
  var payloadListEl = document.getElementById("payload-list");
  var payloadStatusEl = document.getElementById("payload-status");
  var urightEl = document.getElementById("uright");
  var usingUchain = false;
  var elfldrReady = false;
  var jbCompleted = false;

  function log(msg, cls) {
    var d = new Date();
    var t = ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
    var line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = "["+t+"] "+msg;
    if (usingUchain) {
      var consoleEl = document.getElementById("console");
      if (consoleEl) {
        consoleEl.appendChild(line);
        consoleEl.scrollTop = consoleEl.scrollHeight;
        return;
      }
    }
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function switchToUchain() {
    usingUchain = true;
    logEl.style.display = "none";
    uchainEl.style.display = "block";
  }

  function showPayloadPanel(statusText, enableButtons) {
    urightEl.style.display = "flex";
    payloadStatusEl.textContent = statusText || "ready";
    payloadStatusEl.style.color = enableButtons ? "#7fd88a" : "#e05561";
    var btns = payloadListEl.querySelectorAll(".payload-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = !enableButtons;
    }
  }

  function has(list, fw) { for (var i=0;i<list.length;i++) if (list[i]===fw) return true; return false; }

  function setBase(href) {
    var b = document.createElement("base");
    b.href = href;
    document.head.appendChild(b);
  }
  function loadJs(src, isModule) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      if (isModule) s.type = "module";
      s.src = src;
      s.onload = res;
      s.onerror = function () { rej(new Error("failed to load " + src)); };
      document.body.appendChild(s);
    });
  }
  function loadSeq(list) {
    var p = Promise.resolve();
    list.forEach(function (src) { p = p.then(function () { return loadJs(src, false); }); });
    return p;
  }

  /* ===== PAYLOAD DEFINITIONS ===== */
  var PAYLOADS = [
    { name: "shadowmountplus.elf", ghUrl: "https://github.com/drakmor/ShadowMountPlus/releases/download/1.6beta16/shadowmountplus.elf", local: "payload/shadowmountplus.elf" },
    { name: "OnionHEN.elf", ghUrl: "https://github.com/aydencharles/onionHEN/releases/download/v0.0.10/OnionHEN.elf", local: "payload/OnionHEN.elf" }
  ];

  function buildPayloadList() {
    payloadListEl.innerHTML = "";
    PAYLOADS.forEach(function(p, idx){
      var row = document.createElement("div");
      row.className = "payload-item";
      var nameSpan = document.createElement("span");
      nameSpan.className = "payload-name";
      nameSpan.textContent = p.name;
      var btn = document.createElement("button");
      btn.className = "payload-btn";
      btn.textContent = "SEND";
      btn.disabled = true;
      btn.onclick = function(){ sendPayload(idx, btn); };
      row.appendChild(nameSpan);
      row.appendChild(btn);
      payloadListEl.appendChild(row);
    });
  }
  buildPayloadList();

  function fetchPayload(url) {
    return new Promise(function(resolve){
      var req = new XMLHttpRequest();
      req.open("GET", url, true);
      req.responseType = "arraybuffer";
      req.onload = function(){ resolve(req.status === 200 ? req.response : null); };
      req.onerror = function(){ resolve(null); };
      req.ontimeout = function(){ resolve(null); };
      req.timeout = 15000;
      req.send();
    });
  }

  function sendPayload(idx, btn) {
    var p = PAYLOADS[idx];
    btn.disabled = true;
    btn.textContent = "LOADING...";
    log("Loading " + p.name + " ...", "info");
    fetchPayload(p.local).then(function(buf){
      if (!buf) {
        log("Local not found, trying GitHub ...", "warn");
        return fetchPayload(p.ghUrl);
      }
      return buf;
    }).then(function(buf){
      if (!buf) {
        log("Could not load " + p.name, "err");
        btn.disabled = false;
        btn.textContent = "SEND";
        return;
      }
      log(p.name + " loaded (" + buf.byteLength + " bytes)", "success");
      btn.textContent = "SENDING...";
      return sendOnePayload(buf, p.name);
    }).then(function(ok){
      if (ok) {
        btn.textContent = "SENT";
        btn.className = "payload-btn sent";
        btn.disabled = true;
      } else {
        btn.disabled = false;
        btn.textContent = "SEND";
      }
    });
  }

  function sendOnePayload(bytes, name) {
    return new Promise(function(resolve){
      try {
        if (typeof syscall !== "function") { log("syscalls not available", "err"); resolve(false); return; }
        var fd = syscall("socket", 2, 1, 0);
        if (fd < 0) { log("socket() failed: " + fd, "err"); resolve(false); return; }
        var addr = new Uint8Array(16);
        addr[0] = 0x10; addr[1] = 0x02;
        addr[2] = (9021 >> 8) & 0xFF; addr[3] = 9021 & 0xFF;
        addr[4] = 127; addr[5] = 0; addr[6] = 0; addr[7] = 1;
        var conn = syscall("connect", fd, addr, 16);
        if (conn < 0) { syscall("close", fd); log("connect() failed: " + conn, "err"); resolve(false); return; }
        var u8 = new Uint8Array(bytes);
        var sent = 0;
        function writeChunk(){
          if (sent >= u8.length) {
            syscall("close", fd);
            log(name + " sent successfully!", "success");
            resolve(true);
            return;
          }
          var end = Math.min(sent + 65536, u8.length);
          var chunk = u8.subarray(sent, end);
          var w = syscall("write", fd, chunk, chunk.length);
          if (w < 0) { syscall("close", fd); log("write() failed: " + w, "err"); resolve(false); return; }
          sent += w;
          setTimeout(writeChunk, 0);
        }
        writeChunk();
      } catch (e) {
        log(name + " send failed: " + e.message, "err");
        resolve(false);
      }
    });
  }

  /* ===== ELFDR POLLING - this detects when JB is complete ===== */
  function waitForElfldr() {
    if (elfldrReady) return;
    log("Polling elfldr on 127.0.0.1:9021 ...", "info");
    var attempts = 0;
    var maxAttempts = 120; // 6 minutes
    function check(){
      attempts++;
      if (attempts > maxAttempts) {
        log("elfldr not detected after 6 min — showing panel anyway", "warn");
        showPayloadPanel("elfldr not detected — try sending anyway", true);
        return;
      }
      try {
        if (typeof syscall === "function") {
          var fd = syscall("socket", 2, 1, 0);
          if (fd >= 0) {
            var addr = new Uint8Array(16);
            addr[0] = 0x10; addr[1] = 0x02;
            addr[2] = (9021 >> 8) & 0xFF; addr[3] = 9021 & 0xFF;
            addr[4] = 127; addr[5] = 0; addr[6] = 0; addr[7] = 1;
            var conn = syscall("connect", fd, addr, 16);
            syscall("close", fd);
            if (conn >= 0) {
              log("elfldr detected on :9021!", "success");
              elfldrReady = true;
              showPayloadPanel("elfldr ready — select payload", true);
              return;
            }
          }
        }
      } catch (e) {}
      setTimeout(check, 3000);
    }
    check();
  }

  /* ===== umtx2 ===== */
  function runUx() {
    log("loading umtx2 chain...", "info");
    setBase("ux/");
    switchToUchain();
    document.getElementById("uchain").innerHTML =
      '<div id="toast-container" style="display:none"></div>' +
      '<span id="top-bar-text" style="display:none"></span>' +
      '<div id="main-content">' +
      '<div id="pre-jb-view" class="selected" style="display:none"></div>' +
      '<div id="console-view"><div id="console" class="log"></div></div>' +
      '<div id="payloads-view" style="display:none"></div></div>';
    window.alert = function (m) { log("alert: " + m, "warn"); };
    window.confirm = function (m) { log("confirm: " + m + " -> no", "warn"); return false; };
    return loadSeq(["int64.js", "rop.js", "main.js", "umtx2.js", "custom_host_stuff.js", "syscalls.js"])
      .then(function () { return loadJs("psfree/psfree.js", true); })
      .then(function () { return loadJs("payload_map.js", false); })
      .then(function () {
        log("umtx2 loaded — starting exploit", "success");
        run(false, false);
        // Start polling after 10s delay to let exploit run
        log("exploit running — will check for elfldr in 10s", "info");
        setTimeout(waitForElfldr, 10000);
      })
      .catch(function (e) { log("umtx2 failed: " + e.message, "err"); });
  }

  /* ===== poops/p2jb via hidden iframe ===== */
  function runExt(url, name) {
    log("loading " + name + " chain...", "info");
    var frame = document.getElementById("extframe");
    frame.src = url;
    window.addEventListener("message", function onMsg(e){
      if (!e.data || !e.data.bridgeType) return;
      var d = e.data;
      if (d.bridgeType === "log" || d.bridgeType === "stage" || d.bridgeType === "early") {
        var txt = d.text || d.msg || d.item || "";
        var isErr = d.progress === -1 || txt.toLowerCase().indexOf("error") >= 0 || txt.toLowerCase().indexOf("fail") >= 0;
        var isSuccess = txt.toLowerCase().indexOf("success") >= 0 || txt.toLowerCase().indexOf("done") >= 0 || d.progress === 100;
        log("[" + (d.chain||"ext") + "] " + txt, isErr ? "err" : (isSuccess ? "success" : "info"));
      } else if (d.bridgeType === "error" || d.bridgeType === "rejection") {
        log("[" + (d.chain||"ext") + "] ERROR: " + (d.msg||""), "err");
      } else if (d.bridgeType === "jb-done") {
        if (!jbCompleted) {
          jbCompleted = true;
          log("Jailbreak complete — checking for elfldr", "success");
          waitForElfldr();
        }
      }
    });
  }

  /* ===== firmware routing ===== */
  log("unified webkit exploit ready", "success");
  var ua = navigator.userAgent;
  var m = ua.match(/PlayStation 5\/(\d+\.\d+)/);
  var fw = m ? m[1] : null;
  var q = new URLSearchParams(location.search);
  var forced = q.get("chain");

  var chain = null, name = null, extUrl = null;
  if (forced === "ux") { chain = "ux"; name = "umtx2 (forced)"; }
  else if (forced === "poops") { chain = "poops"; name = "poops (forced)"; extUrl = "ext/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128&nullfds=1"; }
  else if (forced === "p2jb") { chain = "p2jb"; name = "p2jb (forced)"; extUrl = "ext/p2jb.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128"; }
  else if (fw && has(UX, fw)) { chain = "ux"; name = "umtx2"; }
  else if (fw && has(POOPS, fw) && !has(P2JB, fw)) { chain = "poops"; name = "poopsploit"; extUrl = "ext/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128&nullfds=1"; }
  else if (fw && has(P2JB, fw)) { chain = "p2jb"; name = "p2JB"; extUrl = "ext/p2jb.html?go=1&auto=1&trigger=netcontrol&payload=1&v=128"; }

  var fwline = document.getElementById("ufwline");
  var armed = false;
  var resume = null;
  try { resume = sessionStorage.getItem("on_load_autorun"); } catch (e) { }

  if (!fw && !forced) {
    fwline.innerHTML = "<b>not a PS5 browser</b> — firmware not detected";
    log("User-Agent has no PlayStation 5 firmware tag: " + ua, "warn");
  } else {
    fwline.innerHTML = "firmware: <b>" + (fw || "?") + "</b>"
      + (name ? " &nbsp;&rarr;&nbsp; chain: <b>" + name + "</b>" : "");
    if (fw) log("detected PS5 firmware " + fw, "success");
    if (!chain) {
      log("firmware " + fw + " is NOT supported (1.00-5.50, 7.00-12.70).", "err");
    } else {
      log("chain selected: " + name + " — auto-run in 1s", "success");
    }
  }

  function start(which, label) {
    if (armed) return;
    armed = true;
    log("starting " + label + " — do not touch the controller...", "success");
    setTimeout(function () {
      if (which === "ux") runUx();
      else if (which === "poops" || which === "p2jb") runExt(extUrl, label);
    }, 1000);
  }

  if (chain && !forced) {
    setTimeout(function () {
      if (!armed) start(chain, name);
    }, 1000);
  }

  if (resume && !armed) {
    log("resuming umtx2 after browser reload...", "warn");
    start("ux", "umtx2 (auto-resume)");
  }
})();
</script>
</body>
</html>
